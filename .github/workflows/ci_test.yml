name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-base

      - run: pnpm test

      - name: Check docs are in sync
        run: pnpm docs:check

      - name: Run runnable examples
        run: pnpm docs:examples

      # Dogfood the consumer action against this branch's build: the release it
      # would fetch from npm by default lacks features this branch may add.
      - name: Check docs with the check-sync action
        uses: ./.github/actions/check-sync
        with:
          documents: |
            README.md
            packages/mdcode/README.md
            examples/CLI_EXAMPLES.md
            TESTING.md
            packages/mdcode/tests/examples/*/README.md
          node-version: ''
          mdcode-command: node packages/mdcode/dist/main.js
