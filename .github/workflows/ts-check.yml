name: TS Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-base

      - name: Run TypeScript Check
        id: ts-check
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          pnpm run lint:ts 2>&1 | tee ts-check-output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Comment TS check results on PR
        if: github.event_name == 'pull_request' && steps.ts-check.outputs.exit_code != '0'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('ts-check-output.txt', 'utf8');
            const output = raw.replace(/[`<>&]/g, c => ({'`':"'", '<':'&lt;', '>':'&gt;', '&':'&amp;'}[c])).slice(0, 60000);
            const comment = `## ❌ TypeScript Check Failed\n\n<details>\n<summary>Click to see type errors</summary>\n\n\`\`\`\n${output}\n\`\`\`\n\n</details>\n\n[View workflow run](${process.env.RUN_URL})`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      - name: Fail if TS check failed
        if: steps.ts-check.outputs.exit_code != '0'
        run: exit 1
